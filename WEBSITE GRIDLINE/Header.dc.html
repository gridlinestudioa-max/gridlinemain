<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/gridline-studio-design-system-62ae2b7c-d574-4cd8-9fc7-2b662095e831/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/gridline-studio-design-system-62ae2b7c-d574-4cd8-9fc7-2b662095e831/tokens/colors.css">
  <link rel="stylesheet" href="_ds/gridline-studio-design-system-62ae2b7c-d574-4cd8-9fc7-2b662095e831/tokens/typography.css">
  <link rel="stylesheet" href="_ds/gridline-studio-design-system-62ae2b7c-d574-4cd8-9fc7-2b662095e831/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/gridline-studio-design-system-62ae2b7c-d574-4cd8-9fc7-2b662095e831/tokens/radius.css">
  <link rel="stylesheet" href="_ds/gridline-studio-design-system-62ae2b7c-d574-4cd8-9fc7-2b662095e831/tokens/shadow.css">
  <link rel="stylesheet" href="_ds/gridline-studio-design-system-62ae2b7c-d574-4cd8-9fc7-2b662095e831/tokens/motion.css">
  <link rel="stylesheet" href="_ds/gridline-studio-design-system-62ae2b7c-d574-4cd8-9fc7-2b662095e831/styles.css">
  <script src="_ds/gridline-studio-design-system-62ae2b7c-d574-4cd8-9fc7-2b662095e831/_ds_bundle.js"></script>
  <style>
    .gl-hdr a{color:var(--text-primary);text-decoration:none;}
    .gl-hdr a:hover{color:var(--text-secondary);}
    .gl-logo-swap{position:relative;display:flex;align-items:center;height:68px;}
    .gl-logo-swap .logo-default,.gl-logo-swap .logo-hover{transition:opacity var(--motion-medium,240ms) cubic-bezier(0.22,0.61,0.36,1);display:flex;align-items:center;}
    .gl-logo-swap .logo-hover{position:absolute;left:0;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none;}
    .gl-logo-swap:hover .logo-default{opacity:0;}
    .gl-logo-swap:hover .logo-hover{opacity:1;}
    @keyframes gl-bar-in{from{transform:translateX(100%);}to{transform:translateX(0);}}
    .animated-button{position:relative;display:flex;align-items:center;gap:4px;height:44px;box-sizing:border-box;padding:0 26px;border:4px solid transparent;font-size:14px;background-color:inherit;border-radius:100px;font-weight:600;color:var(--gl-ink-9);box-shadow:0 0 0 2px var(--gl-ink-9);cursor:pointer;overflow:hidden;transition:all 0.6s cubic-bezier(0.23,1,0.32,1);font-family:var(--font-display);}
    .animated-button svg{position:absolute;width:20px;fill:var(--gl-ink-9);z-index:9;transition:all 0.8s cubic-bezier(0.23,1,0.32,1);}
    .animated-button .arr-1{right:14px;}
    .animated-button .arr-2{left:-25%;}
    .animated-button .circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;background-color:var(--gl-ink-9);border-radius:50%;opacity:0;transition:all 0.8s cubic-bezier(0.23,1,0.32,1);}
    .animated-button .text{position:relative;z-index:1;transform:translateX(-10px);transition:all 0.8s cubic-bezier(0.23,1,0.32,1);}
    .animated-button:hover{box-shadow:0 0 0 12px transparent;color:var(--gl-cream);border-radius:12px;}
    .animated-button:hover .arr-1{right:-25%;}
    .animated-button:hover .arr-2{left:14px;}
    .animated-button:hover .text{transform:translateX(10px);}
    .animated-button:hover svg{fill:var(--gl-cream);}
    .animated-button:active{scale:0.95;box-shadow:0 0 0 4px var(--gl-ink-9);}
    .animated-button:hover .circle{width:200px;height:200px;opacity:1;}
    .gl-menu-btn{position:relative;width:44px;height:44px;box-sizing:border-box;border-radius:var(--radius-full);border:4px solid transparent;box-shadow:0 0 0 1.5px var(--border-strong);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;overflow:hidden;transition:all 0.6s cubic-bezier(0.23,1,0.32,1);}
    .gl-menu-btn .bar{position:relative;z-index:1;display:block;width:18px;height:1.5px;background:var(--text-primary);border-radius:2px;transition:all 0.8s cubic-bezier(0.23,1,0.32,1);}
    .gl-menu-btn .circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;background-color:var(--gl-ink-9);border-radius:50%;opacity:0;z-index:0;transition:all 0.8s cubic-bezier(0.23,1,0.32,1);}
    .gl-menu-btn:hover{border-radius:12px;box-shadow:0 0 0 10px transparent;}
    .gl-menu-btn:hover .bar{background:var(--gl-cream);}
    .gl-menu-btn:hover .circle{width:120px;height:120px;opacity:1;}
    .gl-menu-btn:active{scale:0.95;box-shadow:0 0 0 3px var(--gl-ink-9);}
  </style>
</helmet>

<header class="gl-hdr" style="position: sticky; top: 0; z-index: 90; display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-subtle); background-color: #FFFCF3DB">
  <a href="Home.dc.html" class="gl-logo-swap" aria-label="Gridline Studio home">
    <span class="logo-default">
      <x-import component-from-global-scope="GridlineStudioDesignSystem_62ae2b.Logo" variant="combination" tone="ink" asset-base="assets/logos" height="68" hint-size="128px,60px"></x-import>
    </span>
    <img class="logo-hover" src="assets/logos/gs-mark-hover.png" alt="GS" height="82" style="height:82px;width:auto;display:block;">
  </a>

  <div style="display:flex;align-items:center;gap:14px;position:relative;z-index:90;transition:transform var(--motion-medium,240ms) cubic-bezier(0.22,0.61,0.36,1);transform:translateX({{ controlsShift }});">
    <button class="animated-button" onClick="{{ goContact }}">
      <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg"><path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path></svg>
      <span class="text">Start a project</span>
      <span class="circle"></span>
      <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg"><path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path></svg>
    </button>

    <button type="button" class="gl-menu-btn" onClick="{{ toggleMenu }}" aria-label="Pages" style="background:{{ menuBtnBg }};">
      <span class="circle"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeMenu }}" style="position:fixed;inset:0;z-index:70;background:#08070C1f;"></div>
    <div id="gl-page-bar" style="position:fixed;top:0;right:0;z-index:80;height:100vh;width:fit-content;background:var(--surface-card);border-left:1px solid var(--border-ink);box-shadow:var(--shadow-xl);padding:96px 32px 44px;display:flex;flex-direction:column;gap:4px;animation:gl-bar-in var(--motion-medium,240ms) cubic-bezier(0.22,0.61,0.36,1);">
      <a href="Work.dc.html" style="display:flex;align-items:baseline;gap:16px;padding:10px 20px;border-radius:var(--radius-md);"><span style="font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:-0.02em;white-space:nowrap;">Work</span></a>
      <a href="Services.dc.html" style="display:flex;align-items:baseline;gap:16px;padding:10px 20px;border-radius:var(--radius-md);"><span style="font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:-0.02em;white-space:nowrap;">Services</span></a>
      <a href="About.dc.html" style="display:flex;align-items:baseline;gap:16px;padding:10px 20px;border-radius:var(--radius-md);"><span style="font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:-0.02em;white-space:nowrap;">About</span></a>
      <a href="Contact.dc.html" style="display:flex;align-items:baseline;gap:16px;padding:10px 20px;border-radius:var(--radius-md);"><span style="font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:-0.02em;white-space:nowrap;">Contact</span></a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false, barW: 0 };

  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      menuBtnBg: this.state.menuOpen ? 'var(--gl-ink-1)' : 'transparent',
      controlsShift: this.state.menuOpen && this.state.barW ? ('-' + (this.state.barW + 24) + 'px') : '0px',
      toggleMenu: () => {
        this.setState((s) => ({ menuOpen: !s.menuOpen }));
        setTimeout(() => {
          const el = document.getElementById('gl-page-bar');
          this.setState({ barW: el ? el.offsetWidth : 0 });
        }, 0);
      },
      closeMenu: () => this.setState({ menuOpen: false }),
      goContact: () => { window.location.href = 'Contact.dc.html'; },
    };
  }
}
</script>
</body>
</html>
